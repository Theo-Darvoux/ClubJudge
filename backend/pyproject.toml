[project]
name = "clubjudge-backend"
version = "0.1.0"
description = "ClubJudge API — Club Code, Télécom SudParis"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "argon2-cffi>=23",
    "pyyaml>=6",
    "pydantic[email]>=2.13.4",
]

[project.scripts]
clubjudge-content = "app.content.cli:main"
clubjudge-admin = "app.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: needs docker compose up (Judge0, PostgreSQL)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # migrations autogénérées
