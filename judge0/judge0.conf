# Configuration Judge0 (env_file partagé par server, workers et leur DB/Redis).
# Référence : https://github.com/judge0/judge0/blob/master/judge0.conf

REDIS_HOST=judge0-redis
REDIS_PASSWORD=judge0-internal

POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-internal

# Limites par défaut (surchargées par soumission via l'API)
CPU_TIME_LIMIT=2
MAX_CPU_TIME_LIMIT=15
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288

# Pas d'accès réseau depuis le code jugé
ENABLE_NETWORK=false

# Sans ces deux flags, isolate utilise les cgroups v1 (--cg), inexistants sur
# les hôtes cgroup v2 modernes → Internal Error sur toute soumission. Avec eux,
# les limites passent par rlimit (par processus). Alternative sur le serveur de
# prod : démarrer le noyau avec systemd.unified_cgroup_hierarchy=0 et repasser
# ces flags à false pour une isolation mémoire stricte (docs/operations.md).
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
